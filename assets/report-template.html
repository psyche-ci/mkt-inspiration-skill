<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root{--ink:#030303;--page:#fff;--bg:#000;--muted:#6f6f6f;--line:#cfcfcf;--soft:#f5f5f5;--focus:#ef5d4e}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.42 Inter,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit}.wrap{width:min(760px,calc(100% - 88px));margin:auto}
    .hero{margin:64px auto 0;padding:16px 28px 12px;background:var(--page);border:0}.topline{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:9px;font-size:8px;font-weight:800}.nav-mini{display:flex;gap:10px;color:#333}.eyebrow{font-weight:950;letter-spacing:.01em}.hero h1{margin:10px 0 0;font-size:clamp(54px,11.4vw,128px);line-height:.86;letter-spacing:-.075em;text-transform:uppercase;white-space:nowrap}.observation{display:none}.stats{display:none}.pill{border:1px solid var(--ink);border-radius:999px;padding:5px 10px;background:#fff;font-size:12px;font-weight:900}
    .toolbar{position:sticky;top:0;z-index:10;background:transparent;padding:0}.tools{display:flex;gap:14px;align-items:center;background:#fff;padding:0 28px 22px;border-bottom:1px solid var(--line)}.filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.filter{appearance:none;border:0;background:transparent;padding:0;font-size:8px;font-weight:850;letter-spacing:0;text-transform:none;cursor:pointer}.filter.active{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}input{margin-left:auto;width:150px;border:0;border-bottom:1px solid var(--ink);padding:3px 0;background:transparent;font:inherit;font-size:8px;font-weight:760;outline:none}.filter:focus-visible,input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #ef5d4e66;outline-offset:2px}
    main.wrap{background:#fff;padding:0 28px 68px}.mag-list{display:grid;grid-template-columns:1fr}.digest-row{position:relative;display:grid;grid-template-columns:28px 92px minmax(190px,1.05fr) minmax(180px,.9fr) 98px;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);background:#fff}.issue-no{font-size:8px;font-weight:950}.cover{width:92px;height:92px;border:1px solid #ddd;background:#f2f2f2;object-fit:cover}.cover-missing{display:grid;place-items:center;text-align:center;color:#777;font-size:8px;font-weight:850;line-height:1.25}.meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:7px;font-weight:850}.badge{display:inline-flex;align-items:center;border:0;border-radius:0;background:transparent;padding:0;color:var(--ink);font-weight:900}.rank{background:transparent;color:var(--ink)}.digest-row h2{margin:5px 0 0;font-size:15px;line-height:1.1;letter-spacing:-.035em}.summary{margin:0;color:#222;font-size:7px;font-weight:680}.tags{display:none}.tag{display:inline-block;padding:3px 8px;border:1px solid var(--line);background:#fff;font-weight:850;font-size:11px}.actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:nowrap}.link,.read-toggle,.save-toggle{display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:#000;text-decoration:none;font-size:7px;font-weight:950;letter-spacing:0;text-transform:uppercase;cursor:pointer;white-space:nowrap}.link:after,.read-toggle:after,.save-toggle:after{content:"→";margin-left:4px;transition:transform .22s ease}.link:hover:after,.read-toggle:hover:after,.save-toggle:hover:after{transform:translateX(3px)}
    .save-box{grid-column:3/-1;display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-top:-8px;padding:10px 0 0;border-top:1px dashed var(--line);font-weight:850}.digest-row.saving .save-box{display:flex}.save-box button{border:1px solid var(--ink);border-radius:999px;background:#fff;padding:5px 10px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}
    .ai-reading{grid-column:3/-1;max-height:0;opacity:0;transform:translateY(-8px);overflow:hidden;border-top:0 solid var(--line);transition:max-height .42s ease,opacity .28s ease,transform .28s ease,border-top-width .1s ease}.digest-row.open .ai-reading{max-height:430px;opacity:1;transform:translateY(0);border-top-width:1px;padding-top:16px;margin-top:-8px}.ai-reading h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.ai-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.ai-item{border:1px solid var(--line);padding:12px;background:#fafafa}.ai-item strong{display:block;color:var(--muted);font-size:11px}
    .empty{display:none;text-align:center;padding:54px;color:var(--muted)}footer.wrap{background:#fff;padding:22px 36px 48px;color:var(--muted);font-weight:720;border-top:1px solid var(--line)}
    @media(max-width:980px){.wrap{width:calc(100% - 64px)}}@media(max-width:640px){.wrap{width:calc(100% - 44px)}.hero{margin-top:44px;padding:14px 22px 10px}.hero h1{font-size:clamp(48px,14vw,78px)}.nav-mini{display:none}.tools{padding:0 22px 22px;flex-wrap:nowrap}input{width:120px;margin-left:auto}main.wrap{padding:0 22px 52px}.digest-row{grid-template-columns:22px 72px minmax(0,1fr);gap:12px;padding:17px 0}.digest-row>.summary,.digest-row>.actions,.digest-row>.ai-reading,.digest-row>.save-box{grid-column:3/-1}.cover{width:72px;height:72px}.summary{font-size:8px}.actions{justify-content:flex-start}.ai-grid{grid-template-columns:1fr}footer.wrap{padding:22px 16px 40px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="wrap hero">
    <div class="topline"><span class="eyebrow">AD INSPIRATION PACK</span><span class="nav-mini"><span>DAILY</span><span>LIBRARY</span><span>AI READING</span></span></div>
    <h1>INSPIRATION</h1>
    <p class="observation">{{OBSERVATION}}</p>
    <div class="stats">{{STATS}}</div>
  </header>
  <div class="toolbar"><div class="wrap tools"><div class="filters" id="filters">{{FILTER_BUTTONS}}</div><input id="search" type="search" placeholder="搜索品牌 / 节点 / 形式" aria-label="搜索资讯"></div></div>
  <main class="wrap"><section class="mag-list" id="grid" aria-live="polite">{{CARDS}}</section><p class="empty" id="empty">没有匹配的资讯，换个关键词试试。</p></main>
  <footer class="wrap">{{METHODOLOGY_AND_SOURCE_STATUS}}</footer>
  <script>
    const cards=[...document.querySelectorAll('.digest-row')],buttons=[...document.querySelectorAll('.filter')],search=document.querySelector('#search'),empty=document.querySelector('#empty');let active='全部';
    function apply(){const q=search.value.trim().toLowerCase();let shown=0;cards.forEach(card=>{const category=card.dataset.category||'',haystack=card.textContent.toLowerCase(),visible=(active==='全部'||category===active)&&(!q||haystack.includes(q));card.hidden=!visible;if(visible)shown++});empty.style.display=shown?'none':'block'}
    buttons.forEach(button=>button.addEventListener('click',()=>{active=button.dataset.category;buttons.forEach(x=>x.classList.toggle('active',x===button));apply()}));search.addEventListener('input',apply);
    document.querySelectorAll('.read-toggle').forEach(button=>button.addEventListener('click',()=>{const row=button.closest('.digest-row');row.classList.toggle('open');button.textContent=row.classList.contains('open')?'收起读创意':'AI 读创意'}));
    document.querySelectorAll('.save-toggle').forEach(button=>button.addEventListener('click',()=>{const row=button.closest('.digest-row');row.classList.toggle('saving');button.textContent=row.classList.contains('saving')?'收起收藏夹':'收藏'}));
  </script>
</body>
</html>
