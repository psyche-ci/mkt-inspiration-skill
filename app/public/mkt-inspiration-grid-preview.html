  <script>
    function chooseInspirationFolder(){
      return new Promise(resolve=>{
        const folders=['内容向','形式向','节点向','视觉向'];
        const backdrop=document.createElement('div');
        backdrop.className='folder-picker-backdrop';
        const options=folders.map(folder=>'<button type="button" class="folder-option" data-folder="'+folder+'">'+folder+'</button>').join('');
        backdrop.innerHTML='<div class="folder-picker" role="dialog" aria-modal="true" aria-labelledby="folderPickerTitle"><h3 id="folderPickerTitle">收藏到哪个文件夹？</h3><div class="folder-options">'+options+'</div><button type="button" class="folder-picker-cancel" data-cancel>取消</button></div>';
        const close=value=>{backdrop.remove();resolve(value)};
        backdrop.querySelectorAll('[data-folder]').forEach(button=>button.addEventListener('click',()=>close(button.dataset.folder)));
        backdrop.querySelector('[data-cancel]').addEventListener('click',()=>close(null));
        backdrop.addEventListener('click',event=>{if(event.target===backdrop)close(null)});
        document.body.appendChild(backdrop);
      });
    }
    window.chooseInspirationFolder=chooseInspirationFolder;
  </script>

      ['线下空间的偶遇感，比品牌信息更容易成为用户的分享理由。','将城市快闪设计为可参与的体验，而不是单向陈列。','快闪场景、限定互动、现场 UGC。'],
      ['联名的价值来自共同创造新语境，而非两个 Logo 的并置。','让两方品牌以一套视觉语言讲同一个新身份故事。','视觉共创、联名海报、内容联动。'],
      ['把上新转译为送礼与庆祝，降低产品表达的功能感。','新品被组织成一份等待被打开的节日礼物。','限定包装、礼物清单、节日内容。'],
      ['留白让信息不立即说完，驱动观众主动补全意义。','用一个视觉谜语替代传统产品卖点说明。','海报、单一主视觉、留白构图。'],
      ['品牌借用现场真实情绪，而不抢走事件本身的主角。','将运动能量变成用户可以参与的共同记忆。','现场内容、运动文化、社媒共创。'],
      ['反差让熟悉产品进入陌生语境，形成即时记忆点。','用前后情绪反转完成产品特征的重新解释。','广告片、节奏剪辑、反转叙事。'],
      ['参与动作足够简单时，路人停留就会转化为传播素材。','街角被重写成用户愿意拍摄的品牌装置。','装置、打卡、线下互动。'],
      ['重复的视觉节奏比复杂设计更能建立日常识别。','同一图形系统被延展到每个接触点。','图形系统、品牌设计、触点统一。']
    ];
    document.querySelectorAll('.card').forEach((card, index) => {
      const front = document.createElement('div'); front.className = 'card-front';
      while (card.firstChild) front.appendChild(card.firstChild);
      const [insight, content, form] = readings[index];
      const back = document.createElement('div'); back.className = 'card-back';
      back.innerHTML = `<p class="reading-label">AI 帮你读</p><h2 class="reading-title">${front.querySelector('h2').textContent}</h2><div class="reading-grid"><div class="reading-item"><strong>创意洞察</strong><p>${insight}</p></div><div class="reading-item"><strong>创意内容</strong><p>${content}</p></div><div class="reading-item"><strong>创意形式</strong><p>${form}</p></div></div><textarea class="note-input" placeholder="写下你的想法，保存进灵感库"></textarea><div class="back-actions"><button class="action return-card" type="button">返回正面</button></div>`;
      card.append(front, back);
      front.querySelector('.read-toggle').addEventListener('click', () => card.classList.add('is-reading'));
      back.querySelector('.return-card').addEventListener('click', () => card.classList.remove('is-reading'));
      const saveButton = front.querySelector('.save-toggle');
      saveButton.addEventListener('click', async () => {
        const folders = ['内容向', '形式向', '节点向', '视觉向'];
        const selected = await window.chooseInspirationFolder();
        if (!folders.includes(selected)) return;
        localStorage.setItem(`mkt-inspiration-save-${card.dataset.itemId}`, selected);
        saveButton.textContent = `已收藏 · ${selected}`;
      });
    });
  </script>

    {id:'niod-sephora-20260811',date:'2026-08-11',category:'渠道增长',contentType:'海外产品运营和品牌增长',source:'Global Cosmetic Industry',region:'overseas',isRecentHot:false,evidenceLabel:'运营依据',title:'NIOD 进入 Sephora 北美：科学护肤从小众直营走向高端零售',summary:'DECIEM 旗下 NIOD 于 8 月 11 日先进入 Sephora 北美电商，并计划 8 月 17 日进入美国、加拿大部分门店。品牌没有稀释成分科学与高功效定位，而是利用 Sephora 的教育、试用和门店触点扩大核心用户之外的覆盖。',url:'https://www.gcimagazine.com/brands-products/skin-care/news/22971264/niod-makes-prestige-retail-play-with-sephora-bringing-sciencefirst-skin-care-to-a-wider-audience',cover:'https://img.gcimagazine.com/mindful/allured/workspaces/default/uploads/2026/07/2026-01-27-nid-nec-product-100ml-rl-01.EsNxNig3Zm.jpg?auto=format%2Ccompress&q=70&w=700',heat:'原文明确列出 8 月 11 日北美电商上线、8 月 17 日进入美加部分门店；这是渠道生效信息，不标记为传播热度。',reading:['NIOD 的增长难题不是缺少专业认知，而是高度技术化的表达限制了大众触达。进入 Sephora 的关键价值，是借成熟高端零售渠道把“成分懂行者的小众品牌”带给更广泛消费者，同时不把科学定位降格成普通功效口号。','运营采用线上先行、线下跟进的分阶段节奏：8 月 11 日电商上线先验证搜索、详情页教育与购买需求，8 月 17 日再进入部分门店，用咨询、试用和陈列降低复杂产品的理解门槛。Sephora 获得先进护理品类可信度，NIOD 获得规模化触点。','形式不是单次广告，而是渠道发布、零售内容教育、门店体验和产品组合运营。适合跟踪的后续指标包括站内搜索、首购转化、门店试用、明星单品渗透和复购；页面因此把它归入产品运营与品牌增长，而不是广告创意案例。']}

  const READING_OVERRIDES={
    'digitaling-374632':['成年人在职场、亲密关系和公众评价中，常被“成熟稳重”“固定职业”“某种性格”快速定义。VICUTU 把这种被标签压缩的窒息感作为入口，并借刘昊然从少年演员到成年公众人物的真实成长经历，让“打破标签、自在生长”不仅是品牌口号，也成为目标男性面对身份变化时可以代入的情绪命题。','影片没有直接罗列面料、剪裁或商务场景，而是让刘昊然进入一个像摄影棚又像人生舞台的失真世界：灯光、布景和外界声音不断给他分配角色，他以略带幽默的反应逐步离开预设位置。服装随人物在正式、松弛和行动状态之间切换，承担“身份可以改变，但自我仍然成立”的叙事功能。','执行上采用品牌微电影、代言人个人叙事与舞台化视觉的组合。超现实置景把抽象的社会标签变成可见空间，喜剧节奏降低说教感，服装通过动作和场景自然露出；主片还可拆成单个标签片段、人物金句、造型短剪和幕后内容，适配微博、抖音、小红书等不同传播触点。'],
    'socialbeta-28169':['国际猫咪日常被品牌做成萌宠促销，友望选择为本土猫“正名”，抓住了养宠人对血统偏见、领养议题和文化身份的共同情绪。滚地锦、乌云盖雪等古代雅称既有知识新鲜感，又能让普通土猫获得独特身份；这使品牌不是借节日卖产品，而是先站在宠物家庭一边建立价值认同。','内容先用古代猫咪雅称重新命名不同花色的中华田园猫，把知识科普变成可收藏、可转发的猫咪图鉴；再由品牌代言咪“超级无敌大开门”串联故事，承接领养倡议。产品并非生硬出现，而是落到宠物家庭真实痛点：猫毛缠绕、日常清洁和人与宠物共居，让防缠绕功能成为支持友好养宠生活的解决方案。','形式是“节日事件＋品牌宠物角色＋文化图鉴＋公益倡议＋产品功能”的完整链路。SocialBeta 原文承担案例说明，社交平台可拆成单只猫海报、古称科普轮播、用户晒猫征集和领养信息；若继续扩展，还可让用户上传照片自动匹配古称，形成UGC参与，而不是只发布一次品牌图文。'],
    'socialbeta-28170':['户外品牌常用极限环境证明性能，但 Peak Performance 选择刘雯，是把“自由滑雪不走规定线路”的精神映射到她不被单一模特身份限制的人生轨迹。目标受众未必都去雪山，却都能理解“不按别人规定的路线生活”；因此性能服装被转译成个人选择和自我掌控的象征。','核心主张“THE BEST LINE IS YOUR OWN LINE / 径由心绘”同时指滑雪轨迹、人生路线和服装轮廓。大片以刘雯为叙事中心，通过不同秋冬彩壳、自然色彩和动作状态呈现从城市到户外的切换；产品信息集中在防护、层搭和色彩系统，人物的东方气质与国际经历则为品牌进入中国市场提供可信的文化连接。','形式由代言官宣、品牌宣言片、人物大片和新品视觉组成。主片负责建立精神主题，静态照片负责展示轮廓与配色，短视频可拆为刘雯谈“自己的路线”、穿搭转换和户外动作；同一句口号能横跨广告、门店橱窗、社媒话题与产品页，保证品牌价值和销售内容共用一套表达。'],
    'socialbeta-28164':['七夕广告容易停留在情侣对视和礼物清单，天猫把“缘分红线”转成耳机线、蛋糕装饰、晚霞边缘等日常可见物，抓住年轻人相信浪漫、又反感陈旧神话表达的矛盾。线既是恋爱关系的隐喻，也是贯穿三章故事的视觉线索，让抽象的“注定相遇”变成可以被镜头反复发现的细节。','短片由三段青春爱情情境组成：共同食物形成味觉记忆，晚霞和耳机制造靠近的暧昧时刻，最终通过挑选礼物把情绪落到七夕行动。欧阳娜娜与周翊然承担偶像剧式观看吸引力，红线符号在不同物件间变化；结尾才出现“上淘宝送礼”、立减和叠券信息，先完成情绪沉浸，再把购买变成表达关系的自然下一步。','执行采用明星双主演短片、章节化叙事、统一视觉母题和电商会场联动。每章可以独立剪成社交短视频，红线相关画面可做海报和互动找线内容，演员物料负责扩散，站内会场负责承接转化；形式适合节日营销，因为同一符号既能支撑内容连续性，又能直接连接礼赠商品与优惠机制。'],
    'socialbeta-28186':['音乐品牌真正的资产不是音箱参数，而是“现场音乐仍值得被守护”的文化立场。Marshall 选择成都东郊记忆，是因为当地独立音乐、Livehouse和年轻社群有真实土壤；品牌把消费者对现场消失、演出空间稀缺的担忧，转化为共同参与的城市文化行动，从而避免只靠复古摇滚符号消费情怀。','活动以“KEEP LIVE MUSIC ALIVE”为总命题，把四座Livehouse、本土厂牌、市集、品牌历史和多舞台演出编织成一条体验路线。观众既能看演出，也能理解Marshall与Jimi Hendrix等音乐历史的联系，还能试听Home IV等产品；文化内容负责建立态度，社群合作提供本地可信度，产品体验则在情绪最强的现场自然发生。','形式是园区级多点位活动，而非单一快闪：演出制造高峰时刻，历史展提供可停留内容，市集和社群摊位增加参与密度，天猫超级品牌日承接线上购买。现场可持续产出乐队片段、观众反应、空间摄影和音乐人采访，使一次线下事件延伸成多周社媒内容与电商素材。'],
    'socialbeta-28152':['“秋天第一杯奶茶”已经成为固定社交仪式，用户购买的不只是饮品，而是被惦记、及时获得快乐和参与季节话题的证明。美团没有只重复节气文案，而是拆出两种真实动机：和别人分享快乐，以及想在情绪出现的第一时间喝到；两种动机分别对应品牌的社交价值和即时配送能力。','第一支片用王男、王广的超现实姐弟叙事，把巨型奶茶、意外场景和分享动作做成记忆点，强调一杯饮品如何触发关系互动；第二支回到日常，以突然想喝、快速下单、及时送达的连续动作证明“第1时间喝到”。内容最后连接App搜索、整点免单和神券，让情绪理由、服务能力和促销权益依次出现。','形式采用双TVC分工：一支负责情绪和话题，一支负责功能与转化；再叠加明星/综艺人物、站内搜索口令、整点福利和外卖页面资源。相同节点用两种片型覆盖“想分享”和“想马上得到”的人群，可避免一支广告同时塞入过多信息，也方便分别优化社媒传播和效果投放。'],
    'socialbeta-28139':['年轻消费者对迪士尼联名已经非常熟悉，单纯使用公主和可爱角色很难形成新鲜感。瑞幸反向选择四位经典反派，利用“后妈茶话会”这一网络语境承接自嘲、黑化和个性表达；毒苹果既是反派叙事的核心符号，也能自然转译成饮品口味和派对主题。','内容围绕“苹果派对”展开：毒苹果进入限定饮品命名与视觉，四位反派分别提供角色性格，魔镜、金属贴、异形杯套等道具加强收藏感。文案不把反派洗白，而是鼓励用户借角色表达自己的锋利、野心或坏情绪；产品、包装和周边共同形成一套可拍照的角色身份系统。','形式是影视IP联名、限定饮品、角色化包装、周边收集和社交梗传播的组合。不同反派可拆成多轮预热与人物海报，杯套和冰箱贴负责线下晒图，门店陈列强化派对氛围；“你是哪位后妈”之类测试或用户选角内容还能继续放大参与，而不是把联名停在Logo并置。'],
    'socialbeta-28171':['米菲的价值不只是可爱形象，而是稳定、安静、长期陪伴的情绪感受。润培把这种陪伴与护手霜、润唇膏等高频随身护理连接，抓住用户在通勤、办公和睡前需要低成本治愈的场景；IP因此从包装装饰变成“每天都能遇见的小伙伴”。','系列以“香伴时光”为核心，把清新香调、手部与唇部护理、米菲表情和柔和包装统一起来。手机支架、手提袋、马克杯等周边覆盖办公和居家场景，使消费者在使用护肤品之外仍持续接触IP；内容重点不是讲复杂功效，而是展示不同日常时刻里，一次涂抹和熟悉形象如何提供短暂放松。','形式采用IP联名新品、香氛个护、限定周边和场景化社媒内容。产品静物负责展示质感，米菲插画负责识别，办公桌、包内随身物和床头等场景负责解释使用频率；套装与赠品机制能推动组合购买，用户晒桌面或包内好物又可形成自然UGC。'],
    'socialbeta-28149':['七夕常把爱情描述为永恒盛放，但真实关系包含萌芽、热烈、变化甚至结束。MAC与SKULLPANDA用“花的四重生命”承认这种复杂性，契合年轻用户不愿被单一甜蜜叙事定义的态度；四种阶段又能对应不同唇色，让情绪观点直接服务产品选择。','内容把萌芽、盛放、凋落、枯朽分别转成花朵状态、妆容情绪和口红色号，用户选择的不只是颜色，也是当下的关系态度。程潇广告大片提供人物演绎，SKULLPANDA的暗黑童趣形象强化“美与消逝并存”的视觉张力，手持镜、包装和礼赠继续放大收藏属性。','形式由明星大片、四阶段叙事、潮玩IP包装、色号海报和七夕礼赠构成。每个阶段都可独立成为短片或社媒测试，柜台陈列可按生命顺序组织，用户通过“你处在哪一阶段”选择色号；因此内容机制、购买决策和视觉系统是同一个结构，而非先讲故事再硬接产品。'],
    'marketingdive-827414':['花生酱长期被锁定在PB&J三明治场景，品牌增长的核心障碍不是知名度，而是用户想不到更多吃法。Jif把自身高识别度的红蓝绿Logo改造成可替换的动作词，抓住了“视觉资产已经足够强，可以用它教消费者做新行为”的机会，让品牌焕新直接服务品类扩张。','“Every Jif’ing Thing”把Logo字母重组为dip、sip、mix等动作，并在60秒主片中展示花生酱进入拉面、奶昔、蘸酱等非传统食谱。《O Fortuna》的改编旋律制造夸张仪式感，模拟烹饪节目和创作者试吃则补充可信的使用示范；核心信息是Jif不是某一种搭配，而是一种可以加入任何食物的动作。','执行包括英雄片、广播与流媒体、社媒短视频、创作者内容和视觉识别更新。Logo系统可以持续生成不同动词，使每个新食谱都有统一品牌签名；主片负责改变认知，教程和试吃负责降低尝试门槛，包装及零售陈列则把新用法带到购买现场，形成从品牌传播到实际使用的闭环。'],
    'marketingdive-827309':['成人漏尿是高普遍度却低公开讨论的健康问题，羞耻感会阻碍用户主动了解产品。Always Discreet选择NFL，是因为大量中年女性既是球迷、也是家庭观赛和社交活动的重要组织者；用“不错过比赛瞬间”而不是“治疗尴尬”切入，把敏感需求放回正常生活目标中。','“Protect the Moment”邀请三位NFL球员母亲出镜，她们以真实球迷和母亲身份讲述看球、庆祝和长时间活动时不想被漏尿打断的体验，同时介绍RapidDry等产品功能。人物关系提供信任，比赛瞬间提供具体场景，产品承担的是让用户继续参与，而不是提醒她们存在身体问题。','形式由30秒主片、NFL赛前媒体、社媒人物内容、零售陈列和球场尾箱派对体验组成。大众投放负责正常化议题，球员母亲内容负责降低距离，现场试用与零售负责解决购买顾虑；体育合作适合此案例，因为它让品牌围绕“保护参与感”建立积极语境，而非只在医疗或护理频道里沟通。']
  };
  VERIFIED_ITEMS.forEach(item=>{if(READING_OVERRIDES[item.id])item.reading=READING_OVERRIDES[item.id]});
  const REPORT_DATES=['2026-08-17'];
  const pageSize=9;
  let page=1,category=null,mode='today';
  const gridEl=document.getElementById('grid'),statusEl=document.getElementById('pageStatus'),prevEl=document.getElementById('prevPage'),nextEl=document.getElementById('nextPage'),timeFiltersEl=document.querySelector('.time-filters'),paginationEl=document.querySelector('.pagination');
  const escHtml=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const inReportWindow=i=>REPORT_DATES.includes(i.date);
  const alternateRegions=items=>{
    if(category!=='营销案例')return items;
    const overseas=items.filter(i=>i.region==='overseas'),domestic=items.filter(i=>i.region!=='overseas'),ordered=[];
    while(overseas.length||domestic.length){if(overseas.length)ordered.push(overseas.shift());if(domestic.length)ordered.push(domestic.shift())}
    return ordered;
  };
  const listItems=()=>{
    if(!category)return[];
    let items=VERIFIED_ITEMS.filter(i=>i.contentType===category);
    items=mode==='hot'?items.filter(i=>i.isRecentHot&&(category!=='营销案例'||i.source==='数英网'||i.source==='SocialBeta')):items.filter(inReportWindow);
    items.sort((a,b)=>mode==='today'?(Number(Boolean(b.isRecentHot))-Number(Boolean(a.isRecentHot))||b.date.localeCompare(a.date)):((b.likes??-1)-(a.likes??-1)||((b.favorites??-1)-(a.favorites??-1))||((b.comments??-1)-(a.comments??-1))||((a.rank??999)-(b.rank??999))||b.date.localeCompare(a.date)));
    return alternateRegions(items);
  };
  async function recoverCover(img,item){
    if(img.dataset.recovering)return;
    img.dataset.recovering='1';
    const box=img.closest('.cover');
    box.classList.add('placeholder');
    box.textContent='正在核验原文封面…';
    img.style.display='none';
    try{
      const response=await fetch('/api/find-cover',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:item.url})});
      const payload=await response.json();
      const candidates=payload.ok&&Array.isArray(payload.candidates)?payload.candidates:[];
      for(const candidate of candidates){
        try{
          const imageResponse=await fetch('/api/fetch-image',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:candidate})});
          const imagePayload=await imageResponse.json();
          if(imagePayload.ok&&imagePayload.dataUrl){box.textContent='';box.classList.remove('placeholder');box.appendChild(img);img.style.display='block';img.src=imagePayload.dataUrl;img.dataset.recovered='1';return;}
        }catch(_){/* try the next source image */}
      }
    }catch(_){/* continue to explicit no-cover state */}
    img.remove();box.textContent='原文详情页未找到可核验封面';
  }
  function draw(){const items=listItems(),pages=Math.max(1,Math.ceil(items.length/pageSize));page=Math.min(page,pages);const shown=items.slice((page-1)*pageSize,page*pageSize);gridEl.innerHTML=shown.length?'':'<div class="empty-state">当前视图暂无已核验内容</div>';shown.forEach(item=>{const card=document.createElement('article');card.className='card';card.dataset.itemId=item.id;card.innerHTML=`<div class="card-front"><div class="card-top"><time>${escHtml(item.date.replaceAll('-','.'))}</time><span>来源：${escHtml(item.source)}</span><span class="category">${escHtml(item.category)}</span></div><div class="cover"><img src="${escHtml(item.cover)}" alt="案例原文封面：${escHtml(item.title)}" loading="lazy"></div><h2>${escHtml(item.title)}</h2><p class="summary">${escHtml(item.summary)}</p><p class="summary" style="margin-top:8px;color:#666">${escHtml(item.evidenceLabel)}：${escHtml(item.heat)}</p><div class="actions"><a class="action" href="${escHtml(item.url)}" target="_blank" rel="noopener noreferrer">查看原文</a><button class="action read-toggle" type="button">AI帮你读</button><button class="action save-toggle" type="button">收藏</button></div></div><div class="card-back"><p class="reading-label">AI 帮你读 · 来源：${escHtml(item.source)}</p><h2 class="reading-title">${escHtml(item.title)}</h2><div class="reading-grid"><div class="reading-item"><strong>创意洞察</strong><p>${escHtml(item.reading[0])}</p></div><div class="reading-item"><strong>创意内容</strong><p>${escHtml(item.reading[1])}</p></div><div class="reading-item"><strong>创意形式</strong><p>${escHtml(item.reading[2])}</p></div></div><textarea class="note-input" placeholder="写下你的想法，保存进灵感库"></textarea><div class="back-actions"><button class="action return-card" type="button">返回正面</button></div></div>`;gridEl.appendChild(card);const cover=card.querySelector('.cover img');if(/\.svg(?:$|\?)/i.test(item.cover))recoverCover(cover,item);cover.addEventListener('error',()=>recoverCover(cover,item),{once:true});card.querySelector('.read-toggle').onclick=()=>card.classList.add('is-reading');card.querySelector('.return-card').onclick=()=>card.classList.remove('is-reading');const save=card.querySelector('.save-toggle');save.onclick=()=>{const folders=['内容向','形式向','节点向','视觉向'];const selected=prompt(`收藏到哪个文件夹？\n${folders.join(' / ')}`,'内容向');if(!folders.includes(selected))return;localStorage.setItem(`mkt-inspiration-save-${item.id}`,JSON.stringify({folder:selected,item}));save.textContent=`已收藏 · ${selected}`};const saved=localStorage.getItem(`mkt-inspiration-save-${item.id}`);if(saved){try{save.textContent=`已收藏 · ${JSON.parse(saved).folder}`}catch{}}});statusEl.textContent=`${page} / ${pages} · 共 ${items.length} 条`;prevEl.disabled=page<=1;nextEl.disabled=page>=pages}
  document.querySelectorAll('.filters .filter').forEach(btn=>btn.addEventListener('click',()=>{category=btn.textContent.trim();mode='today';document.querySelectorAll('.filters .filter').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('.time-filter').forEach(b=>b.classList.toggle('active',b.dataset.mode==='today'));timeFiltersEl.hidden=false;gridEl.hidden=false;paginationEl.hidden=false;page=1;draw()}));
  document.querySelectorAll('.time-filter').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('.time-filter').forEach(b=>b.classList.toggle('active',b===btn));page=1;draw()}));
  prevEl.onclick=()=>{if(page>1){page--;draw()}};nextEl.onclick=()=>{if(page<Math.ceil(listItems().length/pageSize)){page++;draw()}};

  <script>
  (()=>{
    const categories=['热点趋势','AI新闻日报','营销案例'];
    const hasToday=category=>typeof VERIFIED_ITEMS!=='undefined'&&VERIFIED_ITEMS.some(item=>(item.contentType||'营销案例')===category&&item.date==='2026-08-17');
    const fallback=()=>categories.find(hasToday);
    const activate=category=>{const button=[...document.querySelectorAll('.filters > .filter')].find(item=>item.textContent.trim()===category);if(button)button.click();};
    document.addEventListener('click',event=>{const button=event.target.closest('.filters > .filter');if(!button)return;const requested=button.textContent.trim();if(!hasToday(requested)){const target=fallback();if(target){event.preventDefault();event.stopImmediatePropagation();activate(target);}}},true);

  })();

  <script>

    const dialog=document.getElementById('apiKeyDialog'),form=dialog?.querySelector('form'),save=document.getElementById('saveApiKeyButton'),key=document.getElementById('apiKeyInput'),provider=document.getElementById('apiProviderInput'),model=document.getElementById('apiModelInput'),base=document.getElementById('apiBaseUrlInput'),button=document.querySelector('.api-key');

    const presets={openai:['https://api.openai.com/v1','gpt-4o-mini'],deepseek:['https://api.deepseek.com/v1','deepseek-chat'],zhipu:['https://open.bigmodel.cn/api/paas/v4','glm-4-flash'],qwen:['https://dashscope.aliyuncs.com/compatible-mode/v1','qwen-plus'],moonshot:['https://api.moonshot.cn/v1','moonshot-v1-8k'],yi:['https://api.lingyiwanwu.com/v1','yi-lightning'],custom:['','']};
    const read=()=>{try{return JSON.parse(localStorage.getItem('mkt-ai-config')||'null')}catch(_){return null}};
    const render=()=>{const configured=Boolean(read()?.apiKey);button.textContent=configured?'API Key 已设置':'设置 API KEY';button.setAttribute('aria-label',button.textContent)};
    const sync=()=>{const preset=presets[provider.value]||presets.custom;const custom=provider.value==='custom';base.style.display=custom?'block':'none';if(!custom){base.value=preset[0];model.value=preset[1]}};
    provider.addEventListener('change',sync);
    button.addEventListener('click',()=>{const cfg=read();provider.value=cfg?.provider||'openai';model.value=cfg?.model||presets[provider.value][1];base.value=cfg?.baseUrl||presets[provider.value][0];key.value='';sync();dialog.showModal()});
    form.addEventListener('submit',event=>{event.preventDefault();const old=read();const apiKey=key.value.trim()||old?.apiKey||'';const preset=presets[provider.value]||presets.custom;const baseUrl=provider.value==='custom'?base.value.trim():preset[0];if(!apiKey||!baseUrl){alert('请填写有效的 API Key 和接口地址');return}localStorage.setItem('mkt-ai-config',JSON.stringify({provider:provider.value,apiKey,model:model.value.trim()||preset[1],baseUrl}));render();dialog.close()});
    document.addEventListener('click',async event=>{
      const trigger=event.target.closest('.read-toggle');if(!trigger)return;
      const card=trigger.closest('.card');const cfg=read();const data=window.MKT_INSPIRATION_DATA?.items||[];const item=data.find(entry=>entry.id===card?.dataset.itemId)||({id:card?.dataset.itemId,contentType:'营销案例',title:card?.querySelector('.card-front h2')?.textContent||'',source:card?.querySelector('.card-top span')?.textContent?.replace(/^来源：/,'')||'',originalUrl:card?.dataset.sourceUrl||'',summary:card?.querySelector('.card-front .summary')?.textContent||'',evidenceText:card?.querySelector('.card-front .evidence')?.textContent||''});const sourceUrl=item.originalUrl||item.url||card?.dataset.sourceUrl||'';if(!card||!item||!sourceUrl)return;
      card.classList.add('is-reading');
      const fields=[...card.querySelectorAll('[data-ai-field]')];
      const fail=message=>{fields.forEach((node,index)=>node.textContent=index===0?`读取失败：${message}`:'未生成。');trigger.disabled=false;trigger.textContent='重新读取'};
      if(!cfg?.apiKey){fail('尚未设置 API Key。请先点击右上角“设置 API KEY”。');dialog.showModal();return}
      if(location.protocol==='file:'){fail('当前以本地文件方式打开，无法访问 AI 接口。请使用项目启动后的 http(s) 网页地址。');return}
      fields.forEach((node,index)=>node.textContent=index===0?'正在读取原文并调用 AI 模型…':'生成中…');trigger.disabled=true;trigger.textContent='AI读取中';
      try{
        const response=await fetch('/api/ai-read',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({provider:cfg.provider,apiKey:cfg.apiKey,baseUrl:cfg.baseUrl,model:cfg.model,sourceUrl,content:[`标题：${item.title}`,`摘要：${item.summary}`,`来源：${item.source}`,`公开依据：${item.evidenceText||''}`].join('\n')})});
        const payload=await response.json();if(!response.ok||!payload.ok)throw new Error(payload.error||`HTTP ${response.status}`);
        const result=payload.result||{};const values=item.contentType==='营销案例'?[result.insight,result.content,result.form]:[result.content||result.insight];
        if(values.some(value=>!String(value||'').trim()))throw new Error('模型返回字段不完整');
        if(item.contentType==='营销案例'&&(String(result.insight).length<30||String(result.content).length<30||String(result.form).length<2||/品牌内容|营销活动/.test(String(result.form))))throw new Error('模型返回不完整或创意形式不具体，请重新读取');
        fields.forEach((node,index)=>node.textContent=values[index]||'原文未说明');trigger.textContent='AI已解读';
      }catch(error){fail(error instanceof Error?error.message:String(error))}
    });
    render();sync();
  })();
  </script>
</body>
</html>
